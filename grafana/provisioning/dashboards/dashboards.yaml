apiVersion: 1
providers:
  - name: 'PaloAlto-Dashboards'
    orgId: 1
    folder: 'Palo Alto Networks'
    type: file
    disableDeletion: true
    editable: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
